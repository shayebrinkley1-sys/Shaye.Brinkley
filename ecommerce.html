

<!DOCTYPE html>
<html>
<head>
  <title>iCarly Penny Tee Shop</title>

  <style>

    body{
      background-color:#fff7fb;
      font-family:Arial, Helvetica, sans-serif;
      margin:0;
      color:#333;
    }

    .banner{
      background:linear-gradient(to right, #ff8fab, #cdb4db, #90dbf4);
      padding:55px;
      text-align:center;
      color:white;
      font-size:55px;
      font-weight:bold;
      letter-spacing:2px;
      text-shadow:2px 2px 8px rgba(0,0,0,0.3);
      border-bottom:6px solid white;
    }

    .intro{
      width:80%;
      margin:35px auto;
      background-color:white;
      padding:22px;
      text-align:center;
      border-radius:25px;
      font-size:20px;
      box-shadow:0px 5px 15px rgba(255,143,171,0.3);
    }

    .gallery{
      width:90%;
      margin:auto;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:30px;
    }

    .thumbnail{
      width:240px;
      background-color:white;
      border-radius:22px;
      overflow:hidden;
      text-align:center;
      box-shadow:0px 5px 15px rgba(0,0,0,0.12);
      transition:0.3s;
    }

    .thumbnail:hover{
      transform:translateY(-8px);
    }

    .thumbnail img{
      width:100%;
      height:260px;
      object-fit:cover;
    }

    .thumbnail p{
      font-size:18px;
      padding:8px;
    }

    .thumbnail a{
      text-decoration:none;
      color:#444;
      font-weight:bold;
    }

    .price{
      color:#7b2cbf;
      font-size:20px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .contact{
      text-align:center;
      margin:50px;
    }

    .contact a{
      background-color:#90dbf4;
      color:white;
      padding:15px 25px;
      border-radius:30px;
      text-decoration:none;
      font-size:20px;
      font-weight:bold;
      box-shadow:0px 4px 10px rgba(0,0,0,0.15);
    }

    footer{
      background-color:#cdb4db;
      color:white;
      text-align:center;
      padding:22px;
      margin-top:50px;
      font-size:18px;
    }

  </style>
</head>

<body>

  <div class="banner">
    iCarly Penny Tee Shop 
  </div>

  <div class="intro">
    Retro Penny Tees inspired by iCarly 
  </div>

  <div class="gallery">

    <div class="thumbnail">
      <a href="shirt1.html">
        <img src="SDPT.jpg.jpg">
        <p>Scuba Donkey Penny Tee</p>
      </a>
      <p class="price">$20</p>
    </div>

    <div class="thumbnail">
      <a href="shirt2.html">
        <img src="ChurchPantsPT.jpg">
        <p>Church Pants Penny Tee</p>
      </a>
      <p class="price">$20</p>
    </div>

    <div class="thumbnail">
      <a href="shirt3.html">
        <img src="SFPT.jpg">
        <p>South Frogspit Penny Tee</p>
      </a>
      <p class="price">$20</p>
    </div>

    <div class="thumbnail">
      <a href="shirt4.html">
        <img src="UFPT.jpg">
        <p>Uncle Female Tee</p>
      </a>
      <p class="price">$20</p>
    </div>

    <div class="thumbnail">
      <a href="shirt5.html">
        <img src="DSPT.jpg">
        <p>Dirty Shirty</p>
      </a>
      <p class="price">$20</p>
    </div>

    <div class="thumbnail">
      <a href="shirt6.html">
        <img src="MDL.jpg">
        <p>Mister Duck Lumps Tee</p>
      </a>
      <p class="price">$20</p>
    </div>

  </div>

  <div class="contact">
    <a href="contact.html">Contact Me For Prices</a>
  </div>

  <footer>
    &copy; 2026 iCarly Penny Tee Shop
  </footer>

</body>
</html>
